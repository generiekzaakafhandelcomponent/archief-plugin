name: Build and publish frontend

on:
  # Allows re-publishing a project without a source change, e.g. after a failed publish.
  workflow_dispatch:
    inputs:
      project:
        description: 'Project under frontend/projects to build and publish'
        required: true
        default: 'plugin'
  push:
    paths:
      - 'frontend/**'
    branches:
      - v12
      - main

jobs:
  # -------------------------------------------------------------
  # Using GitHub's API is not supported for push events
  # -------------------------------------------------------------
  #
  # ----------------------------------------------------------------------------------------------
  # Using local .git history
  # ----------------------------------------------------------------------------------------------
  # Event `push`: Compare the preceding remote commit -> to the current commit of the main branch
  # ----------------------------------------------------------------------------------------------
  changed_files:
    runs-on: ubuntu-latest  # windows-latest || macos-latest
    name: Test changed-files
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      any_changed: ${{ steps.resolve.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # OR "2" -> To retrieve the preceding commit.

      - name: Get changed files
        id: changed-files
        if: github.event_name != 'workflow_dispatch'
        with:
          dir_names: 'true'
          dir_names_max_depth: '1'
          matrix: 'true'
          path: 'frontend/projects'
        uses: tj-actions/changed-files@v45
      # NOTE: `since_last_remote_commit: true` is implied by default and falls back to the previous local commit.

      # A push publishes whichever projects changed; a manual run publishes the
      # project named in the `project` input, since there is no diff to inspect.
      - name: Resolve matrix
        id: resolve
        env:
          CHANGED_MATRIX: ${{ steps.changed-files.outputs.all_changed_files }}
          CHANGED_ANY: ${{ steps.changed-files.outputs.any_changed }}
          PROJECT: ${{ inputs.project }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "matrix=$(jq -cn --arg p "$PROJECT" '[$p]')" >> "${GITHUB_OUTPUT}"
            echo "any_changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "matrix=$CHANGED_MATRIX" >> "${GITHUB_OUTPUT}"
            echo "any_changed=$CHANGED_ANY" >> "${GITHUB_OUTPUT}"
          fi

  Build-and-publish:
    if: needs.changed_files.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    needs: changed_files
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        value: ${{ fromJSON(needs.changed_files.outputs.matrix) }}
    name: Build and publish

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - run: npm install
        working-directory: frontend

      - run: npm run build --workspace=projects/${{ matrix.value }}
        working-directory: frontend

      - name: Publish
        run: |
          PUBLISH_PATH=$(node -e "const p=require('path'); const d=require('./projects/${{ matrix.value }}/ng-package.json').dest; console.log(p.normalize(p.join('projects/${{ matrix.value }}', d)))")
          npm publish "$PUBLISH_PATH" --access public
        working-directory: frontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_SECRET }}
